const DOC_TYPES = ['Lease agreement', 'Service agreement', 'Trade licence', 'Fire NOC', 'Police verification', 'FSSAI licence', 'GST registration', 'Insurance', 'Property tax receipt', 'Other'];
const docChip = (d) => { const n = d.days_left;

    const is = inp(d ? d.issued : '', '', 'date'), ex = inp(d ? d.expires : '', '', 'date'), rd = sel(String(d ? d.remind_days : 30), [['15', '15 days before expiry'], ['30', '30 days before expiry'], ['45', '45 days before expiry'], ['60', '60 days before expiry'], ['90', '90 days before expiry']]);
