<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Zuna Guest House Management</title>
<style>/*__CSS__*/</style>
<style>
.tab[data-on]{background:#12005A;color:#fff}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:#cdc5ec;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:#fff;transition:transform .2s}
input:checked+.sw{background:#02C988}input:checked+.sw::after{transform:translateX(16px)}
.inp{width:100%;border-radius:.75rem;border:0;background:#fff;box-shadow:inset 0 0 0 1px #e6e2f6;padding:.55rem .75rem;font-size:.875rem;color:#12005A}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px #02C988}
.lbl{display:block;font-size:.75rem;font-weight:600;color:#5d5887;margin-bottom:.25rem}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:.5rem;padding:.2rem .55rem;font-size:.75rem;font-weight:600;cursor:pointer;user-select:none;box-shadow:inset 0 0 0 1px #e6e2f6;background:#fff;color:#5d5887}
.chip[data-on]{background:#12005A;color:#fff;box-shadow:none}
</style>
</head>
<body class="bg-zuna-50/60 text-zuna-900 antialiased font-sans min-h-screen">
<header class="sticky top-0 z-30 bg-zuna-900 text-white border-t-4 border-mint-500">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center gap-3">
    <span class="bg-white rounded-lg px-2 py-1 inline-flex"><img src="__ZUNA__" alt="Zuna" class="h-5"></span>
    <span class="font-bold">Admin</span><span class="hidden sm:inline text-zuna-200 text-sm">· Guest House Management</span>
    <div class="ml-auto flex items-center gap-2 text-sm">
      <a href="/" class="rounded-lg px-3 py-1.5 font-semibold text-zuna-100 hover:bg-white/10">Open dashboard</a>
      <span id="me" class="hidden md:inline text-zuna-200"></span>
      <a href="/logout" class="rounded-lg px-3 py-1.5 font-semibold text-zuna-100 hover:bg-white/10">Log out</a>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid gap-6 lg:grid-cols-[260px_minmax(0,1fr)]">
  <!-- clients -->
  <aside class="space-y-3">
    <div class="flex items-center justify-between"><h2 class="text-sm font-bold">Clients</h2><button id="newClient" class="btn-primary !py-1.5 !px-3 text-xs">+ New client</button></div>
    <div id="clients" class="space-y-2"></div>
  </aside>

  <!-- client detail -->
  <main id="detail" class="min-w-0">
    <div class="card p-10 text-center text-sm text-zuna-500">Loading…</div>
  </main>
</div>

<!-- modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-zuna-900/40 backdrop-blur-[2px] overflow-y-auto">
  <div class="min-h-full flex items-start justify-center p-4 sm:p-8">
    <div class="w-full max-w-3xl card shadow-2xl">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-zuna-100"><h3 id="mTitle" class="font-bold"></h3><button id="mClose" class="ml-auto btn !px-2.5" aria-label="Close">✕</button></div>
      <div id="mBody" class="p-6"></div>
    </div>
  </div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] rounded-xl bg-zuna-900 text-white text-sm font-semibold px-4 py-2.5 shadow-xl opacity-0 translate-y-3 transition-all pointer-events-none"></div>

<script>
/*__UIKIT__*/
(() => {
const ME = __ME__;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let S = {clients: []}, cur = null, tab = 'gh';
$('#me').textContent = ME.email;
const toast = (m, bad) => { const t = $('#toast'); t.textContent = m; t.style.background = bad ? '#be123c' : '#12005A'; t.classList.remove('opacity-0', 'translate-y-3'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('opacity-0', 'translate-y-3'), 2600); };
const api = async (p, body) => { const r = await fetch('/api/admin/' + p, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body || {}), credentials: 'same-origin'}); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Request failed (' + r.status + ')'); return j; };
const load = async (keep) => { S = await api('state'); if (!keep || !S.clients.find((c) => c.id === cur)) cur = (S.clients[0] || {}).id || null; render(); };
const C = () => S.clients.find((c) => c.id === cur);
const modal = (title, body) => { $('#mTitle').textContent = title; $('#mBody').replaceChildren(body); $('#modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; };
const closeModal = () => { $('#modal').classList.add('hidden'); document.body.style.overflow = ''; };
ZUI.auto(document.body); $('#mClose').onclick = closeModal; document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
const toDataUrl = (file, max, png) => new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error('Not an image')); img.onload = () => {
  const sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  const x = c.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL(png ? 'image/png' : 'image/jpeg', .82)); }; img.src = fr.result; }; fr.readAsDataURL(file); });
const field = (label, input, cls) => { const w = h(['INPUT', 'TEXTAREA'].includes(input.tagName) ? 'label' : 'div', 'block ' + (cls || '')); w.appendChild(h('span', 'lbl', label)); w.appendChild(input); return w; };
const inp = (v, ph, type) => { const i = h('input', 'inp'); ZUI.noFill(i); i.value = v == null ? '' : v; if (ph) i.placeholder = ph; if (type) i.type = type; return i; };
// opts: 'Value' or ['value', 'Label']; an empty value with a label is shown as the placeholder
const sel = (v, opts) => { const s = h('select', 'inp'); opts.forEach((o) => { const [val, l] = Array.isArray(o) ? o : [o, o]; const op = h('option', null, l); op.value = val; if (val === '') op.dataset.placeholder = '1'; s.appendChild(op); }); s.value = v; return s; };
const switchEl = (label, on) => { const l = h('label', 'flex items-center gap-2.5 cursor-pointer text-sm font-medium'); const c = h('input', 'sr-only'); c.type = 'checkbox'; c.checked = on; l.append(c, h('span', 'sw'), document.createTextNode(label)); l.input = c; return l; };
// tag input: chips + text box (Enter / comma adds)
const tagInput = (vals, sugg) => { const box = h('div', 'rounded-xl bg-white ring-1 ring-zuna-100 p-2 flex flex-wrap gap-1.5'); let items = [...vals];
  const t = h('input', 'flex-1 min-w-[140px] text-sm px-1 py-1 outline-none bg-transparent'); t.placeholder = 'Type and press Enter';
  const draw = () => { $$('.tg', box).forEach((x) => x.remove()); items.forEach((v, i) => { const c = h('span', 'tg chip !cursor-default', v); const x = h('button', 'ml-0.5 text-zuna-400 hover:text-rose-600', '×'); x.type = 'button'; x.onclick = () => { items.splice(i, 1); draw(); }; c.appendChild(x); box.insertBefore(c, t); }); };
  const add = (v) => { v = v.trim(); if (v && !items.includes(v)) items.push(v); draw(); };
  t.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ',') && t.value.trim()) { e.preventDefault(); add(t.value); t.value = ''; } else if (e.key === 'Backspace' && !t.value && items.length) { items.pop(); draw(); } };
  t.onblur = () => { if (t.value.trim()) { add(t.value); t.value = ''; } };
  box.appendChild(t); draw();
  const wrap = h('div', 'space-y-1.5'); wrap.appendChild(box);
  if (sugg) { const s = h('div', 'flex flex-wrap gap-1'); sugg.forEach((v) => { const b = h('button', 'text-[11px] font-semibold text-mint-700 hover:underline', '+ ' + v); b.type = 'button'; b.onclick = () => add(v); s.appendChild(b); }); wrap.appendChild(s); }
  wrap.get = () => items; return wrap; };
// grade chips: click to tick, × to remove the grade, '+ Add grade' for any new grade (shared by every room type in the form, saved to the client's grade list)
const gradePicker = (all, on, peers) => { const w = h('div', 'flex flex-wrap items-center gap-1'); const set = new Set(on); on.forEach((g) => { if (!all.includes(g)) all.push(g); });
  const quick = h('div', 'w-full flex gap-3 mb-1 text-[11px] font-semibold'); [['Select all', () => all], ['Clear', () => []]].forEach(([l, v]) => { const b = h('button', 'text-mint-700 hover:underline', l); b.type = 'button'; b.onclick = () => { set.clear(); v().forEach((g) => set.add(g)); draw(); }; quick.appendChild(b); });
  const ng = h('input', 'w-28 rounded-lg px-2 py-1 text-xs ring-1 ring-zuna-100 outline-none focus:ring-2 focus:ring-mint-500'); ng.placeholder = '+ Add grade'; ZUI.noFill(ng);
  const addG = () => { ng.value.split(',').map((g) => g.trim()).filter(Boolean).forEach((g) => { if (!all.includes(g)) all.push(g); set.add(g); }); ng.value = ''; peers.forEach((p) => p !== w && p.draw()); draw(); ng.focus(); };
  ng.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addG(); } }; ng.onblur = () => { if (ng.value.trim()) addG(); };
  const removeG = (g) => { if (!confirm('Remove grade ' + g + ' from this client\'s grade list? It is taken off every room type in this form.')) return; all.splice(all.indexOf(g), 1); peers.forEach((p) => p.drop(g)); };
  const draw = () => { w.replaceChildren(quick); all.forEach((g) => { const c = h('span', 'chip group !pr-1'); if (set.has(g)) c.dataset.on = ''; c.appendChild(h('span', null, g)); c.title = 'Click to ' + (set.has(g) ? 'untick' : 'tick');
      c.onclick = () => { set.has(g) ? set.delete(g) : set.add(g); draw(); };
      const x = h('button', 'ml-0.5 w-4 h-4 grid place-items-center rounded text-[13px] leading-none opacity-50 hover:opacity-100 hover:bg-rose-500 hover:text-white', '×'); x.type = 'button'; x.title = 'Remove grade ' + g; x.setAttribute('aria-label', 'Remove grade ' + g);
      x.onclick = (e) => { e.stopPropagation(); removeG(g); }; c.appendChild(x); w.appendChild(c); }); w.appendChild(ng); };
  w.drop = (g) => { set.delete(g); draw(); };
  draw(); w.draw = draw; peers.push(w); w.get = () => all.filter((g) => set.has(g)); return w; };
const combo = (v, src, ph, onPick, emptyMsg) => { const w = h('div', 'zd-cwrap'); const i = inp(v, ph); i.setAttribute('role', 'combobox'); i.setAttribute('aria-expanded', 'false');
  const ch = ZUI.chevron(); w.append(i, ch);
  let seq = 0, tm, dirty = false;
  const norm = (o) => typeof o === 'string' ? {label: o} : o;
  const run = async () => { const q = dirty ? i.value.trim() : '', my = ++seq, cv = i.value.trim().toLowerCase();
    if (src.remote) ZUI.show(i, [], {q, loading: true, empty: 'Searching…', onPick: pick});
    let r; try { r = typeof src === 'function' ? await src(q) : src.filter((o) => norm(o).label.toLowerCase().includes(q.toLowerCase())); } catch (e) { r = []; }
    if (my !== seq || document.activeElement !== i) return;
    const items = (r || []).slice(0, 60).map(norm).map((o) => Object.assign({}, o, {selected: !!cv && String(o.value != null ? o.value : o.label).toLowerCase() === cv}));
    ZUI.show(i, items, {q, onPick: pick, empty: q ? 'No matches · press Enter to keep “' + q + '”' : (emptyMsg || 'Start typing to search')}); };
  const pick = (o) => { i.value = o.value != null ? o.value : o.label; dirty = false; if (onPick) onPick(o); };
  i.onfocus = () => { dirty = false; run(); }; i.onclick = () => { if (!ZUI.isOpen(i)) { dirty = false; run(); } };
  i.oninput = () => { dirty = true; clearTimeout(tm); tm = setTimeout(run, src.remote ? 300 : 0); };
  i.onblur = () => { clearTimeout(tm); seq++; setTimeout(() => { if (ZUI.isOpen(i) && document.activeElement !== i) ZUI.close(); }, 120); };
  i.onkeydown = (e) => { if (ZUI.key(e, i)) return; if (e.key === 'ArrowDown' && !ZUI.isOpen(i)) { e.preventDefault(); dirty = false; run(); } };
  ch.onmousedown = (e) => { e.preventDefault(); if (ZUI.isOpen(i)) ZUI.close(); else { i.focus(); dirty = false; run(); } };
  w.input = i; w.get = () => i.value.trim(); w.set = (x) => { i.value = x || ''; }; return w; };
// address / city lookup (OpenStreetMap)
const photon = async (q, extra) => { if (q.length < 3) return []; const r = await fetch('https://photon.komoot.io/api/?limit=8&lang=en&q=' + encodeURIComponent(q) + (extra || '')); if (!r.ok) return []; return ((await r.json()).features || []).map((f) => ({p: f.properties || {}, ll: (f.geometry || {}).coordinates})); };

// ---------- render ----------
const render = () => {
  const L = $('#clients'); L.replaceChildren();
  if (!S.clients.length) L.appendChild(h('p', 'text-sm text-zuna-500', 'No clients yet.'));
  S.clients.forEach((c) => { const b = h('button', 'w-full card p-3 flex items-center gap-3 text-left transition-all hover:shadow-md ' + (c.id === cur ? '!ring-2 !ring-mint-500' : ''));
    const lg = h('span', 'w-12 h-9 rounded-lg bg-white ring-1 ring-zuna-100 grid place-items-center overflow-hidden shrink-0'); if (c.logo) { const i = h('img', 'max-h-6 max-w-10 object-contain'); i.src = c.logo; lg.appendChild(i); } else lg.appendChild(h('span', 'text-xs font-bold text-zuna-400', c.name.slice(0, 3).toUpperCase()));
    const m = h('div', 'min-w-0'); m.appendChild(h('p', 'font-semibold text-sm truncate', c.name)); m.appendChild(h('p', 'text-xs text-zuna-500', c.guesthouses.length + ' guest houses · ' + c.users.length + ' users' + (c.active ? '' : ' · inactive')));
    b.append(lg, m); b.onclick = () => { cur = c.id; render(); }; L.appendChild(b); });
  const D = $('#detail'); D.replaceChildren(); const c = C();
  if (!c) { D.appendChild(h('div', 'card p-10 text-center text-sm text-zuna-500', 'Create your first client to get started.')); return; }
  const top = h('div', 'flex flex-wrap items-center gap-3 mb-4');
  top.appendChild(h('h1', 'text-xl font-bold', c.name));
  const tabs = h('div', 'ml-auto flex gap-1 rounded-xl bg-white ring-1 ring-zuna-100 p-1');
  [['gh', 'Guest houses'], ['users', 'Users'], ['settings', 'Client settings']].forEach(([k, l]) => { const b = h('button', 'tab rounded-lg px-3 py-1.5 text-xs font-semibold text-zuna-600', l); if (tab === k) b.dataset.on = ''; b.onclick = () => { tab = k; render(); }; tabs.appendChild(b); });
  top.appendChild(tabs); D.appendChild(top);
  ({gh: renderGH, users: renderUsers, settings: renderSettings})[tab](D, c);
};

const renderGH = (D, c) => {
  const bar = h('div', 'flex items-center gap-2 mb-3'); bar.appendChild(h('p', 'text-sm text-zuna-500', c.guesthouses.length + ' guest houses · ' + c.guesthouses.filter((g) => g.status === 'Live').length + ' live'));
  const add = h('button', 'ml-auto btn-primary', '+ Add guest house'); add.onclick = () => editGH(c, null); bar.appendChild(add); D.appendChild(bar);
  const g = h('div', 'grid gap-3 md:grid-cols-2');
  c.guesthouses.forEach((x) => { const card = h('div', 'card p-4 flex gap-3');
    const th = h('div', 'w-20 h-20 rounded-xl bg-zuna-50 ring-1 ring-zuna-100 overflow-hidden shrink-0 grid place-items-center text-zuna-300 text-xs'); const i = h('img', 'w-full h-full object-cover'); i.src = x.photos && x.photos[0] ? x.photos[0].url : ZUI.art.gh; i.alt = ''; th.appendChild(i);
    const m = h('div', 'min-w-0 flex-1'); const t = h('div', 'flex items-start gap-2'); t.appendChild(h('p', 'font-bold leading-tight', x.property));
    t.appendChild(h('span', 'ml-auto shrink-0 rounded-full px-2 py-0.5 text-[11px] font-bold ' + (x.status === 'Live' ? 'bg-mint-50 text-mint-700 ring-1 ring-mint-200' : 'bg-zuna-50 text-zuna-500 ring-1 ring-zuna-100'), x.status)); m.appendChild(t);
    m.appendChild(h('p', 'text-xs text-zuna-500 mt-0.5', [x.city, x.rooms + ' rooms', (x.room_types || []).length + ' room types'].filter(Boolean).join(' · ')));
    m.appendChild(h('p', 'text-xs text-zuna-500 truncate', 'Eligible: ' + (x.eligible || '—')));
    const hidden = Object.entries(x.show || {}).filter(([, v]) => !v).map(([k]) => k); m.appendChild(h('p', 'text-[11px] mt-1 ' + (hidden.length ? 'text-amber-700' : 'text-mint-700'), hidden.length ? 'Hidden from client: ' + hidden.join(', ') : 'All details visible to client'));
    const ed = h('button', 'btn !py-1 !px-2.5 text-xs mt-2', 'Edit'); ed.onclick = () => editGH(c, x); m.appendChild(ed);
    card.append(th, m); g.appendChild(card); });
  if (!c.guesthouses.length) g.appendChild(h('div', 'card p-8 text-center text-sm text-zuna-500 md:col-span-2', 'No guest houses yet.'));
  D.appendChild(g);
};

const IN_STATES = {'Andhra Pradesh': 'Visakhapatnam,Vijayawada,Guntur,Tirupati,Nellore,Kakinada,Amaravati,Anantapur,Kurnool,Rajahmundry', 'Arunachal Pradesh': 'Itanagar,Tawang,Pasighat', 'Assam': 'Guwahati,Dibrugarh,Silchar,Jorhat,Tezpur', 'Bihar': 'Patna,Gaya,Bhagalpur,Muzaffarpur,Darbhanga', 'Chhattisgarh': 'Raipur,Bhilai,Bilaspur,Durg,Korba', 'Goa': 'Panaji,Margao,Vasco da Gama,Mapusa,Calangute', 'Gujarat': 'Ahmedabad,Gandhinagar,Surat,Vadodara,Rajkot,Bhavnagar,Jamnagar,Dahej,Hazira,Bharuch,Ankleshwar,Mundra', 'Haryana': 'Gurugram,Faridabad,Panipat,Ambala,Karnal,Sonipat,Hisar,Manesar', 'Himachal Pradesh': 'Shimla,Manali,Dharamshala,Solan,Baddi', 'Jharkhand': 'Ranchi,Jamshedpur,Dhanbad,Bokaro', 'Karnataka': 'Bengaluru,Mysuru,Mangaluru,Hubballi,Belagavi,Udupi,Kalaburagi,Ballari,Shivamogga,Hosur Road', 'Kerala': 'Kochi,Thiruvananthapuram,Kozhikode,Thrissur,Kollam,Kannur', 'Madhya Pradesh': 'Indore,Bhopal,Jabalpur,Gwalior,Ujjain,Pithampur', 'Maharashtra': 'Mumbai,Navi Mumbai,Thane,Pune,Nagpur,Nashik,Aurangabad,Kolhapur,Solapur,Raigad,Ratnagiri,Talegaon', 'Manipur': 'Imphal', 'Meghalaya': 'Shillong', 'Mizoram': 'Aizawl', 'Nagaland': 'Kohima,Dimapur', 'Odisha': 'Bhubaneswar,Cuttack,Rourkela,Paradip,Sambalpur,Puri,Angul', 'Punjab': 'Ludhiana,Amritsar,Jalandhar,Mohali,Patiala,Bathinda', 'Rajasthan': 'Jaipur,Jodhpur,Udaipur,Kota,Ajmer,Bikaner,Bhiwadi,Neemrana', 'Sikkim': 'Gangtok', 'Tamil Nadu': 'Chennai,Coimbatore,Madurai,Tiruchirappalli,Salem,Hosur,Tiruppur,Vellore,Thoothukudi,Kanchipuram,Sriperumbudur,Kanyakumari', 'Telangana': 'Hyderabad,Secunderabad,Warangal,Karimnagar,Nizamabad,Khammam', 'Tripura': 'Agartala', 'Uttar Pradesh': 'Noida,Greater Noida,Ghaziabad,Lucknow,Kanpur,Agra,Varanasi,Prayagraj,Meerut,Mathura', 'Uttarakhand': 'Dehradun,Haridwar,Rishikesh,Roorkee,Nainital,Rudrapur', 'West Bengal': 'Kolkata,Howrah,Durgapur,Asansol,Siliguri,Haldia,Kharagpur', 'Andaman and Nicobar Islands': 'Port Blair', 'Chandigarh': 'Chandigarh', 'Dadra and Nagar Haveli and Daman and const editGH = (c, x) => {
  x = x || {status: 'Coming soon', country: 'India', room_types: [{name: 'Standard', rooms: 1, room_nos: '', occupancy: 'Single', grades: c.grades}], contacts: [{}], inclusions: [], amenities: [], show: {amenities: true, inclusions: true, cancellation: true, photos: true, contacts: true}};
  const f = h('div', 'space-y-6');
  const sec = (t, sub) => { const s = h('section', 'space-y-3'); const hd = h('div'); hd.appendChild(h('h4', 'text-sm font-bold', t)); if (sub) hd.appendChild(h('p', 'text-xs text-zuna-500', sub)); s.appendChild(hd); f.appendChild(s); return s; };
  // basics
  const s1 = sec('Guest house'); const g1 = h('div', 'grid sm:grid-cols-2 gap-3');
  const nm = inp(x.property, 'e.g. My Home Bhooja'), op = inp(x.operator, 'e.g. Sapphire Asta Hospitality'), st = sel(x.status, ['Live', 'Coming soon']);
  const isIN = () => /^india$/i.test(country.get());
  const placeName = (p) => p.city || p.town || p.village || p.locality || p.district || p.county || p.name || '';
  const country = combo(x.country || (x.id && !x.city ? '' : 'India'), COUNTRIES, 'Type to search');
  const state = combo(x.state || Object.keys(IN_STATES).find((k) => IN_STATES[k].split(',').includes(x.city)) || '', (q) => (isIN() ? Object.keys(IN_STATES) : []).filter((k) => k.toLowerCase().includes(q.toLowerCase())), 'Type to search');
  const city = combo(x.city, async (q) => { const ql = q.toLowerCase();
      let r = isIN() ? Object.entries(IN_STATES).filter(([k]) => !state.get() || k === state.get()).flatMap(([k, v]) => v.split(',').map((c) => ({label: c, sub: state.get() ? '' : k, st: k}))).filter((o) => o.label.toLowerCase().includes(ql)) : [];
      if (r.length < 3 && q.length >= 3) { const seen = new Set(r.map((o) => o.label)); (await photon(q + (state.get() ? ', ' + state.get() : '') + (country.get() ? ', ' + country.get() : ''), '&layer=city')).forEach(({p}) => { const n = placeName(p); if (n && !seen.has(n)) { seen.add(n); r.push({label: n, sub: [p.state, p.country].filter(Boolean).join(', '), st: p.state, co: p.country}); } }); }
      return r; }, 'Type to search',
    (o) => { if (o.st) state.set(o.st); if (o.co) country.set(o.co); });
  const map = inp(x.map_url, 'https://maps.app.goo.gl/…');
  const addrSrc = async (q) => (await photon(q + (city.get() && !q.toLowerCase().includes(city.get().toLowerCase()) ? ', ' + city.get() : ''))).map(({p, ll}) => {
      const line = [p.name !== p.street ? p.name : '', [p.housenumber, p.street].filter(Boolean).join(' '), p.locality || p.district].filter(Boolean);
      const full = [...new Set(line.concat([placeName(p) !== p.name ? placeName(p) : '', p.state, p.postcode, p.country]).filter(Boolean))].join(', ');
      return {label: line.join(', ') || placeName(p), sub: [placeName(p), p.state, p.postcode, p.country].filter(Boolean).join(', '), value: full, p, ll}; });
  addrSrc.remote = true;
  const addr = combo(x.address, addrSrc, 'Start typing the address',
    (o) => { const c = placeName(Object.assign({}, o.p, {name: ''})); if (c) city.set(c); if (o.p.state) state.set(o.p.state); if (o.p.country) country.set(o.p.country);
      if (!map.value.trim() && o.ll) map.value = 'https://www.google.com/maps/search/?api=1&query=' + o.ll[1].toFixed(6) + ',' + o.ll[0].toFixed(6); });
  g1.append(field('Name', nm, 'sm:col-span-2'), field('Operator', op), field('Status', st), field('Address', addr, 'sm:col-span-2'), field('Country', country), field('State', state), field('City', city), field('Google Maps link', map));
  g1.appendChild(h('p', 'sm:col-span-2 -mt-1 text-xs text-zuna-500', 'Pick an address from the list to fill city, state, country and the map link automatically.')); s1.appendChild(g1);
  // room types
  const s2 = sec('Room types', 'Each room type has its own rooms, occupancy and eligible grades.'); const rtBox = h('div', 'space-y-3'); s2.appendChild(rtBox);
  const rts = [], grades = [...c.grades], pickers = [];
  const addRT = (r) => { const card = h('div', 'rounded-xl bg-zuna-50/60 ring-1 ring-zuna-100 p-3 space-y-3'); const gg = h('div', 'grid grid-cols-2 sm:grid-cols-3 gap-3');
    const rn = combo(r.name, ROOM_TYPES, 'Pick or type a room type'), nums = Array.from({length: 50}, (_, k) => String(k + 1)); if (r.rooms && !nums.includes(String(r.rooms))) nums.push(String(r.rooms));
    const rc = sel(String(r.rooms || 1), nums), rnos = inp(r.room_nos, 'e.g. 1001-101 to 1001-104'), oc = sel(r.occupancy || 'Single', ['Single', 'Double', 'Single / Double']);
    const bd = sel(r.bed_type || '', [['', 'Select bed type']].concat(BEDS));
    gg.append(field('Room type', rn), field('No. of rooms', rc), field('Bed type', bd), field('Room numbers', rnos, 'col-span-2'), field('Occupancy', oc)); card.appendChild(gg);
    const gp = gradePicker(grades, r.grades || [], pickers); card.appendChild(field('Eligible grades', gp));
    const rm = h('button', 'text-xs font-semibold text-rose-600 hover:underline', 'Remove room type'); rm.type = 'button'; rm.onclick = () => { card.remove(); rts.splice(rts.indexOf(o), 1); pickers.splice(pickers.indexOf(gp), 1); }; card.appendChild(rm);
    const o = {get: () => ({name: rn.get(), rooms: rc.value, room_nos: rnos.value, occupancy: oc.value, bed_type: bd.value, grades: gp.get()})}; rts.push(o); rtBox.appendChild(card); };
  (x.room_types || []).forEach(addRT);
  const arw = h('div', 'flex flex-wrap items-center gap-2'); arw.appendChild(h('span', 'text-xs font-semibold text-zuna-500 mr-1', 'Add room type'));
  [['Standard', 'Queen'], ['Deluxe', 'King'], ['Suite', 'King'], ['Other', '']].forEach(([n, bed]) => { const b = h('button', 'btn !py-1.5 text-xs', '+ ' + n); b.type = 'button';
    b.onclick = () => { addRT({name: n === 'Other' ? '' : n, rooms: 1, occupancy: 'Single', bed_type: bed, grades: []}); const last = rtBox.lastElementChild; last.scrollIntoView({behavior: 'smooth', block: 'center'}); if (n === 'Other') last.querySelector('input').focus(); }; arw.appendChild(b); });
  s2.appendChild(arw);
  // inclusions / amenities / policy
  const s3 = sec('Inclusions & amenities'); const inc = tagInput(x.inclusions || [], INCL), am = tagInput(x.amenities || [], AMEN); s3.append(field('Inclusions', inc), field('Amenities', am));
  const s4 = sec('Cancellation policy'); const pre = CANCEL.find(([, t]) => t === (x.cancellation || '').trim());
  const cps = sel(pre ? pre[0] : (x.cancellation ? 'custom' : ''), [['', 'Select policy']].concat(CANCEL.map(([k, t]) => [k, k === 'nr' ? t : k + ' hrs · ' + t]), [['custom', 'Custom policy']]));
  const cp = h('textarea', 'inp'); cp.rows = 3; cp.placeholder = 'Type the cancellation policy'; cp.value = pre ? '' : (x.cancellation || '');
  const cpSync = () => cp.classList.toggle('hidden', cps.value !== 'custom'); cps.onchange = cpSync; cpSync(); s4.append(cps, cp);
  const cpVal = () => cps.value === 'custom' ? cp.value : ((CANCEL.find(([k]) => k === cps.value) || [, ''])[1]);
  // contacts
  const s5 = sec('Guest house contacts (POC)'); const ctBox = h('div', 'space-y-2'); s5.appendChild(ctBox); const cts = [];
  const addCT = (k) => { const row = h('div', 'grid grid-cols-2 sm:grid-cols-[1fr_1fr_1.2fr_1fr_auto] gap-2 items-end'); const a = inp(k.name, 'Name'), d = inp(k.designation, 'e.g. Caretaker'), e = inp(k.email, 'email@…', 'email'), p = inp(k.phone, '+91 …');
    const rm = h('button', 'btn !px-2.5 text-rose-600', '✕'); rm.type = 'button'; rm.title = 'Remove'; rm.onclick = () => { row.remove(); cts.splice(cts.indexOf(o), 1); };
    row.append(field('Name', a), field('Designation', d), field('Email', e), field('Phone', p), rm); const o = {get: () => ({name: a.value, designation: d.value, email: e.value, phone: p.value})}; cts.push(o); ctBox.appendChild(row); };
  (x.contacts && x.contacts.length ? x.contacts : [{}]).forEach(addCT); const act = h('button', 'btn text-xs', '+ Add contact'); act.type = 'button'; act.onclick = () => addCT({}); s5.appendChild(act);
  // photos
  const s6 = sec('Photos', x.id ? 'JPG, PNG or WEBP. Resized automatically.' : 'Save the guest house first, then add photos.');
  if (x.id) { const grid = h('div', 'grid grid-cols-3 sm:grid-cols-4 gap-2');
    (x.photos || []).forEach((p) => { const t = h('div', 'relative group rounded-xl overflow-hidden ring-1 ring-zuna-100 aspect-[4/3]'); const i = h('img', 'w-full h-full object-cover'); i.src = p.url; t.appendChild(i);
      const del = h('button', 'absolute top-1.5 right-1.5 rounded-lg bg-white/90 px-2 py-0.5 text-xs font-bold text-rose-600 opacity-0 group-hover:opacity-100', 'Delete'); del.type = 'button';
      del.onclick = async () => { if (!confirm('Delete this photo?')) return; try { await api('photo/delete', {id: p.id}); toast('Photo deleted'); await load(true); editGH(C(), C().guesthouses.find((g) => g.id === x.id)); } catch (er) { toast(er.message, true); } }; t.appendChild(del); grid.appendChild(t); });
    const up = h('label', 'rounded-xl ring-1 ring-dashed ring-zuna-200 aspect-[4/3] grid place-items-center text-xs font-semibold text-mint-700 cursor-pointer hover:bg-mint-50', '+ Add photos'); const fi = h('input', 'hidden'); fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true; up.appendChild(fi);
    fi.onchange = async () => { const files = [...fi.files]; for (const [n, file] of files.entries()) { try { toast('Uploading ' + (n + 1) + ' of ' + files.length + '…'); await api('photo', {gh_id: x.id, data_url: await toDataUrl(file, 1600, false)}); } catch (er) { toast(er.message, true); } }
      toast('Photos added'); await load(true); editGH(C(), C().guesthouses.find((g) => g.id === x.id)); };
    grid.appendChild(up); s6.appendChild(grid); }
  // visibility
  const s7 = sec('Show to client', 'Switch off anything the client should not see on their dashboard.'); const sw = h('div', 'grid sm:grid-cols-3 gap-3'); const shows = {};
  [['amenities', 'Amenities'], ['inclusions', 'Inclusions'], ['cancellation', 'Cancellation policy'], ['photos', 'Photos'], ['contacts', 'Contacts (POC)']].forEach(([k, l]) => { const e = switchEl(l, (x.show || {})[k] !== false); shows[k] = e.input; sw.appendChild(e); }); s7.appendChild(sw);
  // actions
  const actions = h('div', 'flex items-center gap-2 pt-2 border-t border-zuna-100');
  if (x.id) { const del = h('button', 'btn text-rose-600', 'Delete guest house'); del.onclick = async () => { if (!confirm('Delete ' + x.property + '? Its photos and contacts are deleted too. Bookings are kept.')) return; try { await api('gh/delete', {id: x.id}); closeModal(); toast('Deleted'); load(true); } catch (er) { toast(er.message, true); } }; actions.appendChild(del); }
  const save = h('button', 'ml-auto btn-primary', x.id ? 'Save changes' : 'Create guest house');
  save.onclick = async () => { save.disabled = true; try {
    const show = {}; Object.entries(shows).forEach(([k, v]) => show[k] = v.checked);
    const r = await api('gh', {id: x.id, client_id: c.id, name: nm.value, city: city.get(), state: state.get(), country: country.get(), address: addr.get(), map_url: map.value, operator: op.value, status: st.value, cancellation: cpVal(), inclusions: inc.get(), amenities: am.get(), show, room_types: rts.map((o) => o.get()), client_grades: grades, contacts: cts.map((o) => o.get())});
    toast('Saved'); await load(true); const fresh = C().guesthouses.find((g) => g.id === r.id); if (!x.id) editGH(C(), fresh); else closeModal(); } catch (er) { toast(er.message, true); } finally { save.disabled = false; } };
  actions.appendChild(save); f.appendChild(actions);
  modal(x.id ? 'Edit ' + x.property : 'New guest house · ' + c.name, f);
};

const pwBox = (email, pw) => { const b = h('div', 'rounded-xl bg-mint-50 ring-1 ring-mint-200 p-4 space-y-2'); b.appendChild(h('p', 'text-sm font-semibold', 'Login details for ' + email));
  const row = h('div', 'flex items-center gap-2'); row.appendChild(h('code', 'flex-1 rounded-lg bg-white ring-1 ring-mint-200 px-3 py-2 font-bold text-base', pw)); const cp = h('button', 'btn', 'Copy'); cp.onclick = () => { navigator.clipboard.writeText(pw).then(() => toast('Copied')); }; row.appendChild(cp); b.appendChild(row);
  b.appendChild(h('p', 'text-xs text-zuna-600', 'Shown once. Share it privately with the user; they can change it with "Forgot password?".')); return b; };
const renderUsers = (D, c) => {
  const bar = h('div', 'flex items-center gap-2 mb-3'); bar.appendChild(h('p', 'text-sm text-zuna-500', c.users.length + ' users · view-only access to ' + c.name + ' guest houses'));
  const add = h('button', 'ml-auto btn-primary', '+ Add user'); add.onclick = () => { const f = h('div', 'space-y-3'); const n = inp('', 'Full name'), e = inp('', 'name@company.com', 'email');
    f.append(field('Name', n), field('Email (login)', e)); const go = h('button', 'btn-primary', 'Create user'); const out = h('div');
    go.onclick = async () => { go.disabled = true; try { const r = await api('user', {client_id: c.id, name: n.value, email: e.value}); if (!r.created) throw new Error('That email already has an account.'); out.replaceChildren(pwBox(e.value.trim().toLowerCase(), r.password)); go.remove(); load(true); } catch (er) { toast(er.message, true); go.disabled = false; } };
    f.append(go, out); modal('Add user · ' + c.name, f); }; bar.appendChild(add); D.appendChild(bar);
  const t = h('div', 'card overflow-x-auto'); const tb = h('table', 'w-full text-sm'); const hd = h('thead'); const hr = h('tr', 'text-left text-xs font-semibold text-zuna-500 bg-zuna-50/70'); ['Name', 'Login', 'Last login', 'Status', ''].forEach((x) => hr.appendChild(h('th', 'px-4 py-2.5', x))); hd.appendChild(hr); tb.appendChild(hd);
  const body = h('tbody', 'divide-y divide-zuna-50');
  c.users.forEach((u) => { const tr = h('tr'); tr.appendChild(h('td', 'px-4 py-3 font-semibold', u.name)); tr.appendChild(h('td', 'px-4 py-3 text-zuna-600', u.email)); tr.appendChild(h('td', 'px-4 py-3 text-zuna-500 whitespace-nowrap', u.last_login ? new Date(u.last_login).toLocaleString('en-IN', {dateStyle: 'medium', timeStyle: 'short'}) : 'Never'));
    const st = h('td', 'px-4 py-3'); st.appendChild(h('span', 'rounded-full px-2 py-0.5 text-[11px] font-bold ' + (u.active ? 'bg-mint-50 text-mint-700 ring-1 ring-mint-200' : 'bg-zuna-50 text-zuna-500 ring-1 ring-zuna-100'), u.active ? 'Active' : 'Disabled')); tr.appendChild(st);
    const ac = h('td', 'px-4 py-3 text-right whitespace-nowrap space-x-2');
    const rs = h('button', 'btn !py-1 !px-2.5 text-xs', 'Reset password'); rs.onclick = async () => { if (!confirm('Create a new password for ' + u.email + '? The old one stops working.')) return; try { const r = await api('user/reset', {email: u.email}); modal('New password', pwBox(u.email, r.password)); } catch (er) { toast(er.message, true); } };
    const tg = h('button', 'btn !py-1 !px-2.5 text-xs ' + (u.active ? 'text-rose-600' : 'text-mint-700'), u.active ? 'Disable' : 'Enable'); tg.onclick = async () => { try { await api('user', {email: u.email, name: u.name, active: !u.active}); toast(u.active ? 'User disabled' : 'User enabled'); load(true); } catch (er) { toast(er.message, true); } };
    ac.append(rs, tg); tr.appendChild(ac); body.appendChild(tr); });
  if (!c.users.length) { const tr = h('tr'); const td = h('td', 'px-4 py-8 text-center text-zuna-500', 'No users yet.'); td.colSpan = 5; tr.appendChild(td); body.appendChild(tr); }
  tb.appendChild(body); t.appendChild(tb); D.appendChild(t);
};

const renderSettings = (D, c) => {
  const card = h('div', 'card p-6 space-y-5 max-w-2xl');
  const lg = h('div', 'flex items-center gap-4'); const pv = h('div', 'w-36 h-16 rounded-xl bg-white ring-1 ring-zuna-100 grid place-items-center overflow-hidden'); if (c.logo) { const i = h('img', 'max-h-12 max-w-32 object-contain'); i.src = c.logo; pv.appendChild(i); } else pv.appendChild(h('span', 'text-xs text-zuna-400', 'No logo'));
  const up = h('label', 'btn cursor-pointer', c.logo ? 'Replace logo' : 'Upload logo'); const fi = h('input', 'hidden'); fi.type = 'file'; fi.accept = 'image/*'; up.appendChild(fi);
  fi.onchange = async () => { try { await api('client/logo', {client_id: c.id, data_url: await toDataUrl(fi.files[0], 600, true)}); toast('Logo updated'); load(true); } catch (er) { toast(er.message, true); } };
  lg.append(pv, up); card.appendChild(field('Client logo (shown in the client\'s dashboard)', lg));

  const gr = h('textarea', 'inp'); gr.rows = 2; gr.value = c.grades.join(', '); card.appendChild(field('Grades used by this client (comma separated, in order)', gr));

$('#newClient').onclick = () => { const f = h('div', 'space-y-3'); const n = inp('', 'e.g. LTM'); f.appendChild(field('Client name', n)); f.appendChild(h('p', 'text-xs text-zuna-500', 'You can add the logo, guest houses and users next.'));
