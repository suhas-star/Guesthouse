<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__TITLE__ · Zuna Guest House Management</title>
<style>/*__CSS__*/</style>
<style>
.e-grid{background-image:linear-gradient(rgba(18,0,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,0,90,.045) 1px,transparent 1px);background-size:36px 36px}
.e-code{background:linear-gradient(180deg,#12005A 0%,#432a93 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.e-ring{animation:eRing 2.4s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes eRing{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
</style>
</head>
<body class="min-h-screen bg-zuna-50/60 text-zuna-900 antialiased font-sans e-grid">
<main class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
  <a href="/" class="mb-8 inline-flex rounded-xl bg-white px-3 py-1.5 ring-1 ring-zuna-100 shadow-sm"><img src="__ZUNA__" alt="Zuna · go to the portal" class="h-6"></a>
  <div class="anim-in w-full max-w-md card p-8 text-center shadow-[0_24px_60px_-24px_rgba(18,0,90,.35)]">
    <div class="relative mx-auto mb-5 w-16 h-16">
      <span class="e-ring absolute inset-0 rounded-2xl ring-2 ring-mint-500/50"></span>
      <span class="relative grid place-items-center w-16 h-16 rounded-2xl bg-zuna-900 text-mint-400">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">__ICON__</svg>
      </span>
    </div>
    <p class="e-code text-6xl font-black tracking-tight leading-none">__CODE__</p>
    <h1 class="mt-3 text-xl font-bold">__TITLE__</h1>
    <p class="mt-2 text-sm leading-relaxed text-zuna-500">__MSG__</p>
    <div class="mt-7 flex flex-wrap justify-center gap-2">
      <a href="__HREF__" class="btn-primary !px-4 !py-2.5 !text-sm">__BTN__</a>
      <button type="button" id="back" class="btn !px-4 !py-2.5 !text-sm">Go back</button>
    </div>
  </div>
  <p class="mt-8 text-xs text-zuna-500">Zuna Guest House Management · Need help? Contact the Zuna Hotel Desk.</p>
</main>
<script>document.getElementById('back').onclick = function () { if (history.length > 1) history.back(); else location.href = '/'; };</script>
</body>
</html>
